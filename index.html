/* =====================================================================
   4. PROCEDURAL WORLD GENERATION (Palmetto County, 4000x4000)
   ===================================================================== */
function zoneOf(bx, by) {
  if (bx >= 9) { return 'beach'; }
  if (bx <= 2 && by >= 7) { return 'swamp'; }
  if (by <= 0) { return 'docks'; }
  if (bx >= 3 && bx <= 6 && by >= 3 && by <= 6) { return 'strip'; }
  return 'suburb';
}
var ZONE_COL = {
  strip:  { g: '#2a0f3d', s: '#5a2a7a', edge: '#ff3fa4' },
  suburb: { g: '#2f5e3d', s: '#8d8379', edge: '#c9b8a6' },
  beach:  { g: '#e6c98a', s: '#d8b877', edge: '#fff1c1' },
  swamp:  { g: '#23402a', s: '#4a5a3a', edge: '#6f8a4e' },
  docks:  { g: '#4b4b57', s: '#6b6b78', edge: '#ffb13b' }
};
var NEON = ['#ff3fa4', '#3ff6ff', '#9b5cff', '#ff8a1f', '#ffe600', '#2ee59d'];

function addBuilding(x, y, w, h, ht, c, roof, neon, bi) {
  var b = { x: x, y: y, w: w, h: h, ht: ht, c: c, roof: roof, neon: neon };
  buildings.push(b);
  blockB[bi].push(b);
}

function genWorld() {
  var bx, by, i, j;
  for (i = 0; i < NB * NB; i++) { blockB.push([]); }
  for (by = 0; by < NB; by++) {
    for (bx = 0; bx < NB; bx++) {
      var bi = by * NB + bx, z = zoneOf(bx, by);
      var ox = bx * CELL + 60, oy = by * CELL + 60, S = 280;
      blockZone[bi] = z;
      if (z === 'strip') {
        /* 2x2 lots of neon towers with random heights */
        for (j = 0; j < 4; j++) {
          if (srnd() < 0.15) { continue; }
          var lx = ox + (j % 2) * 145, ly = oy + Math.floor(j / 2) * 145;
          var ht = srndr(160, 430), nc = NEON[Math.floor(srnd() * NEON.length)];
          var shade = Math.floor(srndr(30, 70));
          addBuilding(lx, ly, srndr(100, 135), srndr(100, 135), ht,
            'rgb(' + (shade + 30) + ',' + shade + ',' + (shade + 60) + ')', '#1c1030', nc, bi);
        }
      } else if (z === 'suburb') {
        for (j = 0; j < 4; j++) {
          var hx = ox + (j % 2) * 150 + 15, hy = oy + Math.floor(j / 2) * 150 + 15;
          if (srnd() < 0.2) { palms.push({ x: hx + 50, y: hy + 50, s: srndr(0.8, 1.2) }); continue; }
          var pastel = pick2(['#f7c6d9', '#c6f0f7', '#f7eac6', '#d9c6f7', '#c6f7d4']);
          addBuilding(hx, hy, srndr(80, 110), srndr(80, 110), srndr(40, 75), pastel, pick2(['#b8556e', '#5577b8', '#b88955', '#7a55b8']), null, bi);
          palms.push({ x: hx - 4, y: hy + 120, s: srndr(0.7, 1.1) });
        }
      } else if (z === 'docks') {
        for (j = 0; j < 6; j++) {
          var cx = ox + (j % 2) * 150, cy = oy + Math.floor(j / 2) * 95 + 5;
          addBuilding(cx, cy, 125, 40, 38, pick2(['#c0392b', '#2980b9', '#27ae60', '#e67e22', '#8e44ad']), '#333', null, bi);
        }
      } else if (z === 'beach') {
        if (srnd() < 0.6) { addBuilding(ox + 110, oy + 110, 50, 50, 30, '#ffb3d1', '#ff3fa4', '#3ff6ff', bi); }
        for (j = 0; j < 7; j++) { palms.push({ x: ox + srndr(0, S), y: oy + srndr(0, S), s: srndr(0.8, 1.3) }); }
      } else { /* swamp */
        for (j = 0; j < 3; j++) { ponds.push({ x: ox + srndr(40, S - 40), y: oy + srndr(40, S - 40), r: srndr(35, 70), bi: bi }); }
        if (srnd() < 0.5) { addBuilding(ox + 20, oy + 200, 60, 45, 28, '#6b5a3a', '#3e3424', null, bi); }
        for (j = 0; j < 5; j++) { palms.push({ x: ox + srndr(0, S), y: oy + srndr(0, S), s: srndr(0.6, 1.0), mangrove: true }); }
      }
    }
  }
  buildMinimap();
}
function pick2(arr) { return arr[Math.floor(srnd() * arr.length)]; }

/* Spatial queries ------------------------------------------------------ */
function isRoad(x, y) {
  if (x < -ROADH || y < -ROADH || x > WORLD + ROADH || y > WORLD + ROADH) { return false; }
  var mx = ((x % CELL) + CELL) % CELL, my = ((y % CELL) + CELL) % CELL;
  return mx < ROADH || mx > CELL - ROADH || my < ROADH || my > CELL - ROADH;
}
function blockList(x, y) {
  var bx = Math.floor(x / CELL), by = Math.floor(y / CELL);
  if (bx < 0 || by < 0 || bx >= NB || by >= NB) { return null; }
  return blockB[by * NB + bx];
}
function inBuilding(x, y) {
  var L = blockList(x, y), i, b;
  if (!L) { return null; }
  for (i = 0; i < L.length; i++) { b = L[i]; if (x >= b.x && x <= b.x + b.w && y >= b.y && y <= b.y + b.h) { return b; } }
  return null;
}
function inPond(x, y) {
  for (var i = 0; i < ponds.length; i++) { var p = ponds[i]; var dx = x - p.x, dy = y - p.y; if (dx * dx + dy * dy < p.r * p.r) { return true; } }
  return false;
}
/* Circle vs building push-out. Entities only need their own block,
   because buildings are inset 60u from block edges (> max radius). */
function pushOut(e, r, z) {
  var L = blockList(e.x, e.y), hit = false, i, b;
  if (L) {
    for (i = 0; i < L.length; i++) {
      b = L[i];
      if (z && z > b.ht) { continue; }          // airborne over a low roof
      var nx = clamp(e.x, b.x, b.x + b.w), ny = clamp(e.y, b.y, b.y + b.h);
      var dx = e.x - nx, dy = e.y - ny, d2 = dx * dx + dy * dy;
      if (d2 < r * r) {
        hit = true;
        if (d2 > 0.0001) { var d = Math.sqrt(d2); e.x += dx / d * (r - d); e.y += dy / d * (r - d); }
        else {
          var l = e.x - b.x, rr = b.x + b.w - e.x, t = e.y - b.y, bt = b.y + b.h - e.y, m = Math.min(l, rr, t, bt);
          if (m === l) { e.x = b.x - r; } else if (m === rr) { e.x = b.x + b.w + r; } else if (m === t) { e.y = b.y - r; } else { e.y = b.y + b.h + r; }
        }
      }
    }
  }
  /* World boundaries (ocean / county line). */
  if (e.x < -30) { e.x = -30; hit = true; } if (e.x > WORLD + 30) { e.x = WORLD + 30; hit = true; }
  if (e.y < -30) { e.y = -30; hit = true; } if (e.y > WORLD + 30) { e.y = WORLD + 30; hit = true; }
  return hit;
}
/* Coarse ray march against buildings. Returns travelled fraction 0..1. */
function rayFrac(x1, y1, x2, y2) {
  var d = dist(x1, y1, x2, y2), n = Math.max(1, Math.ceil(d / 10)), i;
  for (i = 1; i <= n; i++) {
    var f = i / n;
    if (inBuilding(x1 + (x2 - x1) * f, y1 + (y2 - y1) * f)) { return (i - 1) / n; }
  }
  return 1;
}
function los(x1, y1, x2, y2) { return rayFrac(x1, y1, x2, y2) >= 1; }

function Car(type, x, y, a) {
  var T = CAR_TYPES[type];
  this.type = type; this.T = T; this.x = x; this.y = y; this.a = a || 0; this.v = 0;
  this.z = 0; this.vz = 0; this.spin = 0; this.hp = T.hp; this.w = T.w; this.h = T.h;
  this.r = (T.w + T.h) / 4; this.mass = T.mass; this.accelMul = 1; this.maxMul = 1; this.popped = false;
  this.color = T.colors[Math.floor(Math.random() * T.colors.length)];
  this.ai = 'civ'; this.role = ''; this.slot = 0; this.mode = 'cruise'; this.modeT = 0; this.cruise = rnd(120, 175);
  this.dir = 0; this.nx = 0; this.ny = 0; this.tnx = 0; this.tny = 0; this.wpx = -1; this.wpy = -1;
  this.thr = 0; this.str = 0; this.hb = false; this.stuckT = 0; this.revT = 0;
  this.fireCd = rnd(0.8, 2); this.turretA = this.a; this.burnT = -1; this.dead = false; this.deadT = 0;
}
/* Arcade vehicle physics with sub-stepping for fast (TURBO) cars. */
Car.prototype.drive = function (dt) {
  var T = this.T, perk = (this === player.car && player.ch === 1) ? 1.15 : 1;
  var acc = T.accel * this.accelMul * perk, max = T.max * this.maxMul * (this.popped ? 0.45 : 1) * perk;
  var grounded = this.z < 2;
  if (this.dead) { this.thr = 0; this.str = 0; }
  if (grounded) {
    if (this.thr > 0) { this.v += acc * this.thr * dt; }
    else if (this.thr < 0) { if (this.v > 0) { this.v -= T.brake * dt; } else { this.v -= acc * 0.6 * dt; } }
    var drag = this.hb ? 2.0 : 0.55; if (this.thr === 0) { drag += 0.9; }
    if (inPond(this.x, this.y)) { drag += 2.5; }
    this.v -= this.v * drag * dt;
  }
  if (this.v > max) { this.v = max; } if (this.v < -max * 0.4) { this.v = -max * 0.4; }
  var grip = clamp(Math.abs(this.v) / 90, 0, 1) * (this.v < 0 ? -1 : 1);
  if (grounded) { this.a += this.str * T.turn * perk * (this.hb ? 1.5 : 1) * grip * dt; }
  this.a = wrapA(this.a + this.spin * dt);
  this.spin -= this.spin * 2.5 * dt;
  /* sub-steps keep 4x TURBO cars from tunnelling through walls */
  var steps = Math.max(1, Math.ceil(Math.abs(this.v) * dt / 12)), s, sdt = dt / steps, vb = this.v;
  for (s = 0; s < steps; s++) {
    this.x += Math.cos(this.a) * this.v * sdt;

var phoneRect = { x: 0, y: 0, w: 0, h: 0 };

function render() {
  uiButtons.length = 0;
  ctx.setTransform(RS, 0, 0, RS, 0, 0);
  renderWorld();
  drawHUD();
  if (G.phone) { drawPhone(); }
  if (usingTouch && G.over <= 0) { drawTouch(); }
  if (G.wheel) { drawWheel(); }
  if (G.pad) { drawCheatPad(); }

}

/* =====================================================================
   19. CAMERA
   ===================================================================== */
function updateCamera(dt) {
  var P = playerPos(), base = clamp(Math.min(VW, VH) / 720, 0.42, 1.15);
  var sp = player.car ? Math.abs(player.car.v) : 0;
  var target = base * (1 - clamp(sp / 900, 0, 0.35));
  cam.zoom += (target - cam.zoom) * Math.min(1, dt * 2);
  var lead = player.car ? 0.35 : 0;
  var tx = P.x + P.vx * lead, ty = P.y + P.vy * lead, k = Math.min(1, dt * 6);
  cam.x += (tx - cam.x) * k; cam.y += (ty - cam.y) * k;
}

/* =====================================================================
   20. SAVE / LOAD (localStorage, guarded for hosts without storage)
   ===================================================================== */
function save() {
  try { if (window.localStorage && window.JSON) {
    window.localStorage.setItem('neontide_save', JSON.stringify({ cash: G.cash, score: G.score, trust: G.trust, jobs: G.jobs, mi: G.missionIdx, ch: player.ch, owned: player.owned, ammo: player.ammo, followers: G.followers }));
  } } catch (e) { }
}
function load() {
  try { if (window.localStorage && window.JSON) {
    var s = window.localStorage.getItem('neontide_save'); if (!s) { return; }
    var d = JSON.parse(s); G.cash = d.cash || 0; G.score = d.score || 0; G.trust = d.trust || 50; G.jobs = d.jobs || 0;
    G.missionIdx = d.mi || 0; player.ch = d.ch || 0; G.followers = d.followers || 1200;
    if (d.owned) { player.owned = d.owned; } if (d.ammo) { player.ammo = d.ammo; }
  } } catch (e) { }
}

/* =====================================================================
   21. NATIVE HOST HOOKS (Cordova, Capacitor, Electron, NW.js)
   ===================================================================== */
function hostName() {
  return PLATFORM.electron ? 'electron' : (PLATFORM.nw ? 'nw.js' : (PLATFORM.capacitor ? 'capacitor' : (window.cordova ? 'cordova' : (PLATFORM.android ? 'android-web' : 'browser'))));
}
function pauseGame() { G.paused = true; save(); }
function resumeGame() { G.paused = false; lastT = now(); }
function backButton() {
  if (G.console) { G.console = false; } else if (G.pad) { G.pad = false; } else if (G.wheel) { G.wheel = false; }
  else if (G.phone && G.page !== 'home') { G.page = 'home'; } else { togglePhone(); }
}
function lockLandscape() {
  try {
    var so = window.screen && window.screen.orientation;
    if (so && so.lock) { var r = so.lock('landscape'); if (r && r['catch']) { r['catch'](function () { }); } }
  } catch (e) { }
}
function initHosts() {
  /* Cordova: lifecycle + hardware back button + keep screen awake */
  on(document, 'deviceready', function () {
    PLATFORM.cordova = true; lockLandscape();
    on(document, 'backbutton', function (e) { stop(e); backButton(); });
    on(document, 'pause', pauseGame); on(document, 'resume', resumeGame);
    if (window.plugins && window.plugins.insomnia) { window.plugins.insomnia.keepAwake(); }
    if (window.StatusBar && window.StatusBar.hide) { window.StatusBar.hide(); }

  if (cap && cap.Plugins && cap.Plugins.App && cap.Plugins.App.addListener) {

    lockLandscape();

  if (PLATFORM.nw && window.nw && window.nw.Window) {
    on(window, 'keydown', function (e) { if ((e.keyCode || e.which) === 122) { window.nw.Window.get().toggleFullscreen(); } });
  }

/* Public API for host wrappers, automated test rigs and the hot-reloader. */
window.NeonTide = {

  cheat: function (c) { return runCheat(c); },

  intent: function (action, data) { if (action === 'cheat') { runCheat(data); } else if (action === 'phone') { togglePhone(); } else if (action === 'back') { backButton(); } },
  state: function () { return { fps: gfx.fps, low: gfx.low, wanted: G.wanted, cash: G.cash, hp: player.hp, armor: player.armor, inCar: !!player.car, cars: cars.length, peds: peds.length, police: countPolice(), gravity: G.gravMul, weapon: player.weap, ammo: player.ammo.slice(0), t: G.t, mission: G.mission ? G.mission.def.name : null }; },
  debug: { G: G, player: player, cars: cars, gfx: gfx }
};

/* =====================================================================
   22. BOOT & MAIN LOOP
   ===================================================================== */
var lastT = now(), errCount = 0;
function frame() {

    try {
      telemetry(rdt);
      update(rdt);
      updateCamera(rdt);
      render();
    } catch (err) {
      /* never let one bad frame kill the loop on fragile legacy engines */

  for (i = 0; i < 20; i++) { var s = sidewalkPoint(); peds.push(new Ped(s.x, s.y)); }
