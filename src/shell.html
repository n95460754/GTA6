  =====================================================================
  NEON TIDE: PALMETTO COUNTY
  An original open-world neon crime sandbox (genre tribute, original
  characters, setting and content).

  ENGINE CONSTRAINTS (deliberate):
    * One self-contained file. No images, no audio files, no libraries.
    * STRICT ES5: var / function / prototypes only. No let, const,
      arrow functions, classes, promises or template literals.
    * Canvas 2D only (no WebGL, no Web Audio). All art is procedural.
    * Bounded memory: every dynamic list has a hard cap (particles,
      scorch marks, tracers, rockets, spikes, pickups, police).

  HOST WRAPPERS supported by the platform layer (section 1):
    Browser, Electron, NW.js, Cordova, Capacitor, plain Android WebView.
    A host can force software/legacy rendering with ?soft=1 or by
    defining window.NeonTideHost = { softwareRender: true } before load.
  =====================================================================
-->
